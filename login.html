<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Streakit</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(120deg, #181818 0%, #232526 60%, #764ba2 100%);
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background: url('https://www.transparenttextures.com/patterns/cubes.png');
      opacity: 0.08;
    }
    .login-container {
      position: relative;
      z-index: 1;
    }
    .login-container {
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      padding: 2.5rem 2rem;
      width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .login-logo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      margin-bottom: 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .login-title {
      font-size: 1.7rem;
      font-weight: 500;
      color: #fff;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }
    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .login-form input {
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.18);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: background 0.2s;
    }
    .login-form input:focus {
      background: rgba(255,255,255,0.28);
    }
    .login-btn {
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #764ba2 0%, #667eea 100%);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    .login-btn:hover {
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
    }
    .login-footer {
      margin-top: 1.2rem;
      color: #bbb;
      font-size: 0.95rem;
      text-align: center;
    }
    .material-icons {
      vertical-align: middle;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="images/image.png" alt="Streakit Logo" class="login-logo">
    <div class="login-title"><span class="material-icons">lock</span>Login to Streakit</div>
    <form class="login-form" id="loginForm">
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <div class="login-footer">Don't have an account? <a href="signup.html" style="color:#667eea;">Sign up</a></div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var username = document.querySelector('.login-form input[type="text"]').value;
      var password = document.querySelector('.login-form input[type="password"]').value;
      var storedUser = localStorage.getItem('streakit_user');
      var storedPass = localStorage.getItem('streakit_pass');
      if (username === storedUser && password === storedPass) {
        alert('Login successful!');
        // Redirect to home or profile page
        window.location.href = 'index.html';
      } else {
        alert('Invalid credentials. Please try again or sign up.');
      }
    });
  </script>
</body>
</html>
